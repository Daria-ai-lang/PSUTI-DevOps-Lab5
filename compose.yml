services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kazan_events
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

 backend:
    image: ghcr.io/nelkor/kazan-events:latest
    ports:
      - "8001:8000"
    environment:
      - PG_DB_NAME=kazan_events
      - PG_USER_NAME=postgres
      - PG_USER_PASSWORD=postgres
      - PG_HOST=db
      - PG_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  
    ports:
      - "8080:80"
    depends_on:
      - backend
